name: Keep Alive Render Service

on:
  schedule:
    # Runs every 10 minutes to keep the Render free tier container awake
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Django Backend
        run: |
          status_code=$(curl -s -o /dev/null -w "%{http_code}" https://portfolio-builder-backend-3z7l.onrender.com/api/ping/)
          echo "Ping response status: $status_code"
